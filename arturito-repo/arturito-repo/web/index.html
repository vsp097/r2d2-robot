<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ARTURITO · Control Console</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --void:#080c17;--panel:#0f1626;--panel-2:#141f33;--line:#22304d;
    --blue:#4da6ff;--blue-dim:#2b6fb0;--blue-glow:rgba(77,166,255,.35);
    --amber:#f5a623;--amber-glow:rgba(245,166,35,.3);
    --ink:#eaf1fb;--ink-dim:#7d8daa;--ok:#5bd6a0;--danger:#ff6b6b;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0}
  body{font-family:'Inter',system-ui,sans-serif;background:radial-gradient(1200px 600px at 50% -10%, #10203a 0%, transparent 60%),var(--void);color:var(--ink);min-height:100vh;padding:16px 16px 24px;display:flex;flex-direction:column;align-items:center;background-attachment:fixed}
  .wrap{width:100%;max-width:440px;position:relative;z-index:1}
  header{position:relative;text-align:center;margin:4px 0 16px}
  .eyebrow{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:10px;letter-spacing:4px;color:var(--blue);text-transform:uppercase;margin-bottom:4px}
  h1{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:34px;letter-spacing:7px;margin:0;color:#fff;text-shadow:0 0 24px var(--blue-glow)}
  .status-line{font-family:'Chakra Petch',sans-serif;font-size:11px;letter-spacing:1px;color:var(--ink-dim);margin-top:6px;display:flex;gap:8px;justify-content:center;align-items:center}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-dim);display:inline-block}
  .dot.live{background:var(--ok);box-shadow:0 0 10px var(--ok)}
  .gear{position:absolute;top:0;right:0;background:var(--panel-2);border:1px solid var(--line);color:var(--ink-dim);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
  .panel{background:linear-gradient(180deg,var(--panel) 0%,var(--panel-2) 100%);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:12px}
  .panel-label{font-family:'Chakra Petch',sans-serif;font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--blue);margin-bottom:12px}
  .voice-panel{text-align:center;padding-top:18px;padding-bottom:18px}
  .dome{width:112px;height:112px;border-radius:50%;margin:0 auto 12px;border:none;cursor:pointer;background:radial-gradient(circle at 50% 34%, #1b2740 0%, #0c1220 70%),var(--panel);box-shadow:0 0 0 2px var(--line);display:flex;align-items:center;justify-content:center}
  .dome .eye{width:40px;height:40px;border-radius:50%;background:radial-gradient(circle at 50% 40%, #6fc0ff 0%, var(--blue) 45%, var(--blue-dim) 100%)}
  .dome.listening .eye{background:radial-gradient(circle at 50% 40%, #ffd98a 0%, var(--amber) 50%, #b9781a 100%)}
  .readouts{display:flex;gap:8px;margin-top:14px}
  .readout{flex:1;background:var(--void);border:1px solid var(--line);border-radius:9px;padding:8px 10px;text-align:left;min-height:48px}
  .readout .k{font-family:'Chakra Petch',sans-serif;font-size:9px;letter-spacing:1.5px;color:var(--ink-dim);text-transform:uppercase}
  .readout .v{font-size:13px;color:var(--ink);margin-top:3px}
  .tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:12px}
  .tab{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:12px;letter-spacing:1px;text-transform:uppercase;background:var(--panel);border:1px solid var(--line);color:var(--ink-dim);padding:12px 6px;border-radius:11px;cursor:pointer}
  .tab.active{background:linear-gradient(180deg,#173254,#102338);color:#fff;border-color:var(--blue)}
  .tabview{display:none}
  .tabview.active{display:block}
  .cruceta{display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:60px;gap:8px;max-width:224px;margin:0 auto}
  .pad{background:var(--panel-2);border:1px solid var(--line);border-radius:11px;color:var(--ink);font-size:22px;cursor:pointer;display:flex;align-items:center;justify-content:center;user-select:none}
  .pad.up{grid-column:2;grid-row:1}.pad.left{grid-column:1;grid-row:2}
  .pad.stop{grid-column:2;grid-row:2;background:#2a1420;border-color:#5a2436;color:var(--danger)}
  .pad.right{grid-column:3;grid-row:2}.pad.down{grid-column:2;grid-row:3}
  .dist-wrap{display:flex;align-items:center;gap:14px}
  .dist-num{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:30px;color:var(--blue);min-width:70px;text-align:right}
  .bar{flex:1;height:10px;background:var(--void);border:1px solid var(--line);border-radius:6px;overflow:hidden}
  .bar > i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--danger),var(--amber),var(--ok))}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  button.act{background:var(--panel-2);border:1px solid var(--line);color:var(--ink);font-family:'Inter',sans-serif;font-size:14px;padding:14px 10px;border-radius:10px;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:7px}
  .full{width:100%}
  .explain-btn{background:linear-gradient(180deg,#1a2b1f,#122018);border:1px solid #2c5a3c;color:#bfefd2;font-family:'Chakra Petch',sans-serif;font-weight:600;letter-spacing:1px;font-size:14px;padding:15px;border-radius:11px;cursor:pointer;width:100%}
  select{width:100%;background:var(--void);border:1px solid var(--line);color:var(--ink);font-size:14px;padding:12px;border-radius:10px;margin-bottom:8px}
  .sub-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:4px}
  .spacer{height:8px}
  .statusbar{position:sticky;bottom:12px;margin-top:8px;width:100%;max-width:440px;background:rgba(8,12,23,.92);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-family:'Chakra Petch',sans-serif;font-size:12px;color:var(--ok);text-align:center}
  .statusbar.warn{color:var(--amber)}.statusbar.err{color:var(--danger)}
  .overlay{position:fixed;inset:0;background:rgba(4,7,14,.75);display:none;align-items:center;justify-content:center;z-index:10;padding:20px}
  .overlay.open{display:flex}
  .modal{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:20px;width:100%;max-width:340px}
  .ip-row{display:flex;gap:8px}
  .ip-row input{flex:1;background:var(--void);border:1px solid var(--line);color:var(--ink);font-size:15px;padding:11px 12px;border-radius:9px}
  .modal-actions{display:flex;gap:8px;margin-top:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <button class="gear" onclick="abrirIP()" aria-label="Settings">⚙</button>
    <div class="eyebrow">Astromech Unit</div>
    <h1>ARTURITO</h1>
    <div class="status-line"><span class="dot" id="linkDot"></span><span id="linkTxt">Link idle</span></div>
  </header>

  <div class="panel voice-panel">
    <button class="dome" id="dome" aria-label="Talk to Arturito"><span class="eye"></span></button>
    <div class="voice-hint">Tap the eye and give a command (Spanish)</div>
    <div class="readouts">
      <div class="readout"><div class="k">Heard</div><div class="v" id="rHeard">—</div></div>
      <div class="readout"><div class="k">Command</div><div class="v cmd" id="rCmd">—</div></div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="drive">Drive</button>
    <button class="tab" data-tab="modes">Modes</button>
    <button class="tab" data-tab="sounds">Sounds</button>
  </div>

  <div class="tabview active" id="view-drive">
    <div class="panel">
      <div class="panel-label">Manual driving</div>
      <div class="cruceta">
        <button class="pad up" data-cmd="adelante">▲</button>
        <button class="pad left" data-cmd="izquierda">◀</button>
        <button class="pad stop" id="stopBtn">STOP</button>
        <button class="pad right" data-cmd="derecha">▶</button>
        <button class="pad down" data-cmd="atras">▼</button>
      </div>
    </div>
    <div class="panel">
      <div class="panel-label">Proximity sensor</div>
      <div class="dist-wrap">
        <div class="dist-num"><span id="distNum">--</span> cm</div>
        <div class="bar"><i id="distBar"></i></div>
      </div>
    </div>
    <div class="panel">
      <div class="panel-label">Accessories</div>
      <div class="grid">
        <button class="act" onclick="ejecutar('laser_on')">🔴 Laser ON</button>
        <button class="act" onclick="ejecutar('laser_off')">⚫ Laser OFF</button>
      </div>
      <div class="sub-grid">
        <button class="act" onclick="ejecutar('mira_izq')">↺ Look left</button>
        <button class="act" onclick="ejecutar('mira_der')">↻ Look right</button>
      </div>
    </div>
  </div>

  <div class="tabview" id="view-modes">
    <div class="panel">
      <div class="panel-label">Personality modes</div>
      <div class="grid">
        <button class="act" onclick="ejecutar('modo_feliz')">😄 Happy</button>
        <button class="act" onclick="ejecutar('modo_fiesta')">🎉 Party</button>
        <button class="act" onclick="ejecutar('modo_molesto')">😠 Angry</button>
        <button class="act" onclick="ejecutar('modo_asustado')">😱 Scared</button>
      </div>
      <button class="act full" style="margin-top:8px" onclick="ejecutar('modo_messi')">⚽ Autonomous exploration (10s)</button>
    </div>
    <div class="panel">
      <div class="panel-label">Presentation</div>
      <button class="explain-btn" onclick="ejecutar('explicar')">▶ Self-introduction</button>
      <div class="spacer"></div>
      <button class="act full" onclick="detenerAudio()">■ Stop audio</button>
    </div>
  </div>

  <div class="tabview" id="view-sounds">
    <div class="panel">
      <div class="panel-label">Sounds</div>
      <select id="sonidoSel">
        <option value="saludo">Greeting</option>
        <option value="adios">Farewell</option>
        <option value="audio:1">Song 1</option>
        <option value="audio:2">Song 2</option>
        <option value="audio:3">Song 3</option>
        <option value="audio:4">Scream</option>
      </select>
      <button class="act full" onclick="ejecutar(document.getElementById('sonidoSel').value)">▶ Play sound</button>
      <div class="spacer"></div>
      <button class="act full" onclick="detenerAudio()">■ Stop audio</button>
    </div>
  </div>
</div>

<div class="statusbar" id="statusbar">System ready</div>

<div class="overlay" id="ipOverlay">
  <div class="modal">
    <h3 style="font-family:'Chakra Petch',sans-serif;color:#fff">Robot link</h3>
    <p style="font-size:12px;color:var(--ink-dim)">Enter the IP shown in the Arduino Serial Monitor.</p>
    <div class="ip-row"><input id="ip" value="192.168.1.51"></div>
    <div class="modal-actions">
      <button class="act full" onclick="probarEnlace()">Test link</button>
      <button class="act full" onclick="cerrarIP()">Done</button>
    </div>
  </div>
</div>

<script>
// >>>>> PASTE YOUR GEMINI API KEY HERE <<<<<
const API_KEY = "PASTE_YOUR_GEMINI_API_KEY";
const MODELO = "gemini-2.5-flash";

// Base file names (no extension) — the page tries "<name>.mp3" automatically.
const SONIDOS = {
  saludo:"saludo", motores:"motores", sensor:"sensor",
  laser_exp:"laser", adios:"adios",
  cancion1:"0001", cancion2:"0002", cancion3:"0003",
  grito:"0004", fiesta:"0006", messi_saludo:"0007",
  obstaculo:"0008", laser_fx:"0009", haaland:"haaland"
};
const EXPLICACION = ["saludo","motores","sensor","laser_exp","adios"];
function candidatos(base){ return [base + ".mp3"]; }

const dome=document.getElementById('dome');
const rHeard=document.getElementById('rHeard');
const rCmd=document.getElementById('rCmd');
const bar=document.getElementById('statusbar');
const linkDot=document.getElementById('linkDot');
const linkTxt=document.getElementById('linkTxt');
function estado(m,t){bar.textContent=m;bar.className='statusbar'+(t?' '+t:'');}
function ipRobot(){return document.getElementById('ip').value.trim();}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click',()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.tabview').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.getElementById('view-'+t.dataset.tab).classList.add('active');
  });
});
function abrirIP(){document.getElementById('ipOverlay').classList.add('open');}
function cerrarIP(){document.getElementById('ipOverlay').classList.remove('open');}

let player=new Audio();
let colaAudio=[]; let cancelado=false; let extras=[];
const SILENCIO = "data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAgLsAAAB3AQACABAAZGF0YQAAAAA=";
let audioListo=false;
function desbloquearAudio(){
  if(audioListo) return;
  const s=new Audio(SILENCIO); s.play().catch(()=>{});
  audioListo=true;
}
document.addEventListener('click', desbloquearAudio);
document.addEventListener('touchstart', desbloquearAudio, {passive:true});

function intentar(base, alTerminar){
  const opciones=candidatos(base); let i=0;
  const probar=()=>{
    if(i>=opciones.length){estado('Sound not found: '+base,'err');return;}
    player.src=opciones[i];
    player.play().catch(err=>{
      if(err && err.name==='NotAllowedError'){
        desbloquearAudio();
        setTimeout(()=>{ if(!cancelado){ player.play().catch(()=>estado('Tap the screen and try again','warn')); } }, 80);
      } else { i++; probar(); }
    });
  };
  player.onerror=()=>{i++;probar();};
  player.onended=alTerminar||null;
  probar();
}
function reproducir(base){cancelado=false;colaAudio=[];intentar(base,null);}
function reproducirLista(bases){
  if(!bases.length)return;
  cancelado=false; colaAudio=bases.slice(1);
  const siguiente=()=>{ if(cancelado)return; if(colaAudio.length>0){const b=colaAudio.shift();intentar(b,siguiente);} };
  intentar(bases[0], siguiente);
}
function detenerAudio(){
  cancelado=true; colaAudio=[];
  player.pause(); player.currentTime=0; player.onended=null; player.onerror=null;
  extras.forEach(a=>{try{a.pause();a.currentTime=0;}catch(e){}}); extras=[];
  estado('Audio stopped');
}

function enviarRobot(cmd){
  fetch("http://"+ipRobot()+"/api/cmd?c="+cmd,{mode:'no-cors'})
    .then(()=>estado('Command sent: '+cmd))
    .catch(()=>estado('Could not reach the robot — check IP/WiFi','err'));
}

function ejecutar(cmd){
  if(!cmd)return;
  rCmd.textContent=cmd;
  switch(cmd){
    case 'adelante': case 'atras': case 'izquierda':
    case 'derecha': case 'parar': case 'para_todo':
      enviarRobot(cmd); break;
    case 'modo_feliz': reproducir(SONIDOS.haaland); enviarRobot('modo_feliz'); estado('HAPPY MODE'); break;
    case 'modo_fiesta': reproducir(SONIDOS.fiesta); enviarRobot('modo_fiesta'); estado('PARTY MODE'); break;
    case 'modo_molesto': reproducir(SONIDOS.laser_fx); enviarRobot('modo_molesto'); estado('ANGRY MODE','warn'); break;
    case 'modo_asustado': reproducir(SONIDOS.grito); enviarRobot('asustado'); estado('SCARED MODE'); break;
    case 'modo_messi': reproducir(SONIDOS.messi_saludo); enviarRobot('modo_messi'); estado('AUTONOMOUS MODE (10s)'); vigilarObstaculo(); break;
    case 'explicar': reproducirLista(EXPLICACION.map(k=>SONIDOS[k])); estado('Playing self-introduction'); break;
    case 'saludo': reproducir(SONIDOS.saludo); estado('Greeting'); break;
    case 'adios': reproducir(SONIDOS.adios); estado('Farewell'); break;
    case 'laser_on': case 'laser_off':
    case 'mira_izq': case 'mira_der':
      enviarRobot(cmd); break;
    default:
      if(cmd.startsWith('audio:')){
        const n=cmd.substring(6).trim();
        const mapa={'1':SONIDOS.cancion1,'2':SONIDOS.cancion2,'3':SONIDOS.cancion3,'4':SONIDOS.grito};
        if(mapa[n]){reproducir(mapa[n]);estado('Playing audio '+n);}
      } else { enviarRobot(cmd); }
  }
}

let vigilando=false;
function vigilarObstaculo(){
  if(vigilando)return; vigilando=true;
  const fin=Date.now()+11000; let ultimo=0;
  const iv=setInterval(async()=>{
    if(Date.now()>fin){clearInterval(iv);vigilando=false;return;}
    try{
      const r=await fetch("http://"+ipRobot()+"/api/estado");
      const d=await r.json();
      if(d.distancia>0&&d.distancia<20&&Date.now()-ultimo>2500){
        ultimo=Date.now();
        const fx=new Audio(SONIDOS.obstaculo+".mp3"); extras.push(fx); fx.play().catch(()=>{});
      }
    }catch(e){}
  },350);
}

document.querySelectorAll('.pad[data-cmd]').forEach(btn=>{
  const cmd=btn.getAttribute('data-cmd');
  const ir=e=>{e.preventDefault();enviarRobot(cmd);};
  const parar=e=>{e.preventDefault();enviarRobot('parar');};
  btn.addEventListener('mousedown',ir);
  btn.addEventListener('mouseup',parar);
  btn.addEventListener('mouseleave',parar);
  btn.addEventListener('touchstart',ir,{passive:false});
  btn.addEventListener('touchend',parar,{passive:false});
});
document.getElementById('stopBtn').addEventListener('click',()=>enviarRobot('para_todo'));

async function leerDistancia(){
  try{
    const r=await fetch("http://"+ipRobot()+"/api/estado",{cache:'no-store'});
    const d=await r.json();
    const cm=(d.distancia>=0)?Math.round(d.distancia):null;
    document.getElementById('distNum').textContent=cm===null?'--':cm;
    const pct=cm===null?0:Math.max(0,Math.min(100,cm));
    document.getElementById('distBar').style.width=pct+'%';
    linkDot.classList.add('live'); linkTxt.textContent='Link active';
  }catch(e){linkDot.classList.remove('live'); linkTxt.textContent='Link idle';}
}
function probarEnlace(){
  estado('Testing link with '+ipRobot()+' ...');
  leerDistancia().then(()=>{
    if(linkDot.classList.contains('live'))estado('Link active with the robot');
    else estado('No response — check IP and WiFi','err');
  });
}
setInterval(leerDistancia,1000);
leerDistancia();

const RV=window.SpeechRecognition||window.webkitSpeechRecognition;
let recon=null;
if(RV){
  recon=new RV();
  recon.lang='es-ES'; recon.continuous=false; recon.interimResults=false;
  recon.onresult=e=>{const t=e.results[0][0].transcript;rHeard.textContent=t;preguntarGemini(t);};
  recon.onend=()=>dome.classList.remove('listening');
  recon.onerror=e=>{estado('Voice error: '+e.error,'warn');dome.classList.remove('listening');};
}else{estado('This browser does not support voice — try Chrome','warn');}

dome.addEventListener('click',()=>{
  desbloquearAudio();
  if(!recon){estado('Voice recognition not available','warn');return;}
  rHeard.textContent='...'; rCmd.textContent='...';
  estado('Listening...'); dome.classList.add('listening');
  try{recon.start();}catch(e){}
});

async function preguntarGemini(texto){
  if(API_KEY==="PASTE_YOUR_GEMINI_API_KEY"){estado('Missing Gemini API key in the code','err');return;}
  estado('Thinking...');
  const url="https://generativelanguage.googleapis.com/v1beta/models/"+MODELO+":generateContent?key="+API_KEY;
  const instruccion=
`You are the brain of an R2-D2-inspired robot called Arturito. The user speaks in Spanish. Reply with ONLY ONE command word from this list, no explanation, no punctuation:

MOVEMENT: adelante, atras, izquierda, derecha, parar
MODES: modo_feliz, modo_fiesta, modo_molesto, modo_asustado, modo_messi
LASER: laser_on, laser_off
HEAD: mira_izq, mira_der
SOUNDS: saludo, adios
SONGS: audio:1, audio:2, audio:3
INTRO: explicar

User message: "${texto}"
Reply with ONLY the exact command.`;
  try{
    const resp=await fetch(url,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({contents:[{parts:[{text:instruccion}]}]})});
    const datos=await resp.json();
    let cmd=datos.candidates[0].content.parts[0].text.trim().toLowerCase();
    cmd=cmd.replace(/[."'\n]/g,'').trim();
    ejecutar(cmd);
  }catch(err){estado('Gemini error — check API key or connection','err');}
}
</script>
</body>
</html>
